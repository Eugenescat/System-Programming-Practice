syntax = "proto3";

package dfs_service;

service DFSService {

    // Add your service calls here

    // 1. REQUIRED (Parts 1 & 2): A method to store files on the server

    // 2. REQUIRED (Parts 1 & 2): A method to fetch files from the server

    // 3. REQUIRED (Parts 1 & 2): A method to list all files on the server

    // 4. REQUIRED (Parts 1 & 2): A method to get the status of a file on the server

    // 5. REQUIRED (Part 2 only): A method to request a write lock from the server

    // 6. REQUIRED (Part 2 only): A method named CallbackList to handle asynchronous file listing requests
    //                            from a client. This method should return a listing of files along with their
    //                            attribute information. The expected attribute information should include name,
    //                            size, modified time, and creation time.

    // 7. REQUIRED (Part 2 only): A method to delete a file from the server

    // 8. Any other methods you deem necessary to complete the tasks of this assignment

    // Part 1 RPCs
    rpc StoreFile (stream StoreFileRequest) returns (StoreFileResponse);
    rpc FetchFile (FetchFileRequest) returns (stream FetchFileResponse);
    rpc DeleteFile (DeleteFileRequest) returns (DeleteFileResponse);
    rpc ListFiles (ListFilesRequest) returns (ListFilesResponse);
    rpc GetFileStatus (GetFileStatusRequest) returns (GetFileStatusResponse);

    // Part 2 RPCs
    rpc RequestWriteAccess (WriteLockRequest) returns (WriteLockResponse);
    rpc CallbackList (FileRequest) returns (FileList); // async file update trigger

}

// Add your message types here

// ========== Message Definitions ==========

// ---- Store ----
message StoreFileRequest {
  string filename = 1;
  bytes data = 2;
  string client_id = 3;
}

message StoreFileResponse {
  string filename = 1;
  int64 mtime = 2;
  string message = 3;
}

// ---- Fetch ----
message FetchFileRequest {
  string filename = 1;
}

message FetchFileResponse {
  bytes data = 1;
  string filename = 2;
  int64 mtime = 3;
}

// ---- Delete ----
message DeleteFileRequest {
  string filename = 1;
  string client_id = 2;
}

message DeleteFileResponse {
  string filename = 1;
  string message = 2;
}

// ---- List ----
message ListFilesRequest {}

message FileMetadata {
  string filename = 1;
  int64 mtime = 3;
}

message ListFilesResponse {
  repeated FileMetadata files = 1;
}

// ---- Stat ----
message GetFileStatusRequest {
  string filename = 1;
}

message GetFileStatusResponse {
  string filename = 1;
  int64 size = 2;
  int64 mtime = 3;
  int64 ctime = 4;
  uint32 crc = 5;
}

// ---- Write Lock ----
message WriteLockRequest {
  string filename = 1;
  string client_id = 2;
}

message WriteLockResponse {
  bool granted = 1;
  string message = 2;
}

// ---- Callback ----
message FileRequest {
  string name = 1; // ignored in this assignment
}

message FileList {
  repeated GetFileStatusResponse files = 1;
}